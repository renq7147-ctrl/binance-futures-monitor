name: diag

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 中转通道实测
        run: |
          set +e
          target="https://fapi.binance.com/fapi/v1/ticker/24hr?symbol=BTCUSDT"
          enc=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$target")
          urls=(
            "https://cors.isomorphic-git.org/$target"
            "https://api.codetabs.com/v1/proxy?quest=$enc"
            "https://api.allorigins.win/raw?url=$enc"
            "https://corsproxy.io/?url=$enc"
            "https://r.jina.ai/$target"
            "https://api.cors.lol/?url=$enc"
            "https://proxy.cors.sh/$target"
            "https://thingproxy.freeboard.io/fetch/$target"
            "https://test.cors.workers.dev/?$target"
          )
          for u in "${urls[@]}"; do
            printf "%-60s " "${u:0:60}"
            out=$(curl -sL -m 30 -o /tmp/r.txt -w "%{http_code}|%{size_download}" "$u")
            printf "%-14s " "$out"
            head -c 90 /tmp/r.txt | tr -d '\n' | tr -s ' '
            echo
          done
          echo
          echo "== 直接连（对照）=="
          curl -s -m 15 -o /dev/null -w "fapi.binance.com http=%{http_code}\n" "https://fapi.binance.com/fapi/v1/ping"
      - name: 全量行情体积
        run: |
          set +e
          enc=$(python3 -c "import urllib.parse;print(urllib.parse.quote('https://fapi.binance.com/fapi/v1/ticker/24hr',safe=''))")
          for u in "https://cors.isomorphic-git.org/https://fapi.binance.com/fapi/v1/ticker/24hr" \
                   "https://api.codetabs.com/v1/proxy?quest=$enc"; do
            printf "%-55s " "${u:0:55}"
            curl -sL -m 60 -o /tmp/full.txt -w "http=%{http_code} size=%{size_download} time=%{time_total}s\n" "$u"
          done
