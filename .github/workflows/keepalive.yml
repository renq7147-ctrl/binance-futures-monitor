name: keepalive

# GitHub 会在仓库连续 60 天无活动后自动停用定时任务，
# 本工作流每月写入一次心跳文件，避免监控任务被静默关闭。

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 更新心跳文件
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          if git diff --cached --quiet; then
            echo "心跳无变化，跳过提交"
          else
            git commit -m "chore: keepalive $(date -u +%F)"
            git push
          fi
